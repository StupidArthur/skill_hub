<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI Style · Studio Workspace Case</title>
<style>
:root{--text:#171719;--muted:#6e6e73;--line:#e8e8eb;--line2:#d9d9dd;--control:#f5f5f6;--hover:#ededf0;--sidebar:rgba(250,250,251,.9);--accent:#0a84ff;--ok:#2f7d48;--warn:#9a681a;--danger:#b8453d}
*{box-sizing:border-box}html,body{margin:0;height:100%;min-width:1060px}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC",sans-serif;color:var(--text);background:#f2f2f4;font-size:12px}button{font:inherit;color:inherit;cursor:pointer}.app{width:calc(100vw - 28px);height:calc(100vh - 28px);margin:14px;background:#fff;border:1px solid rgba(0,0,0,.11);border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.12);overflow:hidden;display:grid;grid-template-columns:224px minmax(0,1fr);transition:grid-template-columns .18s}.app.rail{grid-template-columns:62px minmax(0,1fr)}
.sidebar{background:var(--sidebar);backdrop-filter:blur(20px);border-right:1px solid var(--line);overflow:hidden}.side-inner{height:100%;padding:14px 10px 10px;display:flex;flex-direction:column}.side-top{height:28px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 4px}.traffic{display:flex;gap:7px}.traffic i{width:12px;height:12px;border-radius:50%;display:block}.traffic i:nth-child(1){background:#ff5f57}.traffic i:nth-child(2){background:#febc2e}.traffic i:nth-child(3){background:#28c840}.collapse{width:28px;height:28px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center}.collapse:hover{background:var(--hover)}.collapse svg,.nav-icon svg,.tool svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 12px;font-weight:650}.brandmark{width:24px;height:24px;border-radius:6px;background:#111;color:#fff;display:grid;place-items:center;font-size:10px}.nav{display:grid;gap:6px}.nav-group-head,.nav-leaf{width:100%;height:36px;border:0;background:transparent;border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 8px;text-align:left;font-weight:620;color:#3f3f44}.nav-group-head:hover,.nav-leaf:hover{background:rgba(0,0,0,.035)}.nav-group-head.active-parent .nav-icon,.nav-leaf.active .nav-icon{color:#171719}.nav-icon{width:18px;height:18px;display:grid;place-items:center;flex:0 0 auto;color:#6e6e74}.chev{margin-left:auto;color:#a2a2a8;transition:transform .15s}.nav-group.open .chev{transform:rotate(90deg)}.children{display:none;margin:2px 0 0 26px;padding-left:9px;border-left:1px solid #dedee2;gap:2px}.nav-group.open .children{display:grid}.child{height:30px;border:0;background:transparent;border-radius:6px;text-align:left;padding:0 8px;color:#74747a;font-size:11px}.child:hover{background:rgba(0,0,0,.03);color:#444}.child.active{font-weight:650;color:#111;position:relative}.child.active:before{content:"";position:absolute;left:-10px;top:7px;width:2px;height:16px;border-radius:2px;background:#111}.spacer{flex:1}.profile{border-top:1px solid rgba(0,0,0,.06);padding:10px 7px 0;display:flex;align-items:center;gap:9px}.avatar{width:28px;height:28px;border-radius:7px;background:#efeff1;border:1px solid #dfdfe2;display:grid;place-items:center;font-size:9px}.profile small{display:block;color:var(--muted);margin-top:2px}
.rail .traffic,.rail .brand,.rail .children,.rail .label,.rail .profile div:not(.avatar),.rail .chev{display:none!important}.rail .side-top{justify-content:center;padding:0}.rail .nav-group-head,.rail .nav-leaf{width:40px;margin:0 auto;padding:0;display:grid;place-items:center;position:relative}.rail .nav-icon{margin:0}.rail .active-parent:after,.rail .nav-leaf.active:after{content:"";position:absolute;right:2px;top:50%;width:3px;height:3px;background:#1a1a1c;border-radius:50%;transform:translateY(-50%)}.rail .profile{justify-content:center;padding-left:0;padding-right:0}
.main{min-width:0;display:flex;flex-direction:column}.toolbar{height:54px;flex:0 0 auto;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 18px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px)}.title h1{font-size:14px;margin:0;font-weight:650}.title p{font-size:10px;color:var(--muted);margin:2px 0 0}.tools{display:flex;gap:4px}.tool{width:28px;height:28px;border:0;background:transparent;border-radius:7px;display:grid;place-items:center;color:#66666c}.tool:hover,.tool.active{background:var(--hover);color:#222}.workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}.workspace.with-inspector{grid-template-columns:minmax(0,1fr) 310px}.workspace.with-output{grid-template-rows:minmax(0,1fr) 190px}.canvas{min-width:0;min-height:0;overflow:auto;background:#fff}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px 20px 12px}.card{border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.025)}.metric{min-height:94px;padding:13px 14px;display:flex;flex-direction:column;justify-content:space-between}.metric .name{font-size:10px;color:var(--muted)}.metric b{font-size:20px;letter-spacing:-.02em}.metric small{color:var(--muted)}.bar{height:4px;border-radius:99px;background:#efeff1;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#7ea2dd}.sections{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 18px}.section.wide{grid-column:1/-1}.section-head{height:39px;padding:0 13px;border-bottom:1px solid #f0f0f1;display:flex;align-items:center;justify-content:space-between}.section-head h3{font-size:11px;margin:0}.section-head span{font-size:9px;color:var(--muted)}.row{min-height:45px;padding:8px 13px;border-bottom:1px solid #f2f2f3;display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(90px,.7fr) minmax(90px,.7fr);align-items:center;gap:12px}.row:last-child{border-bottom:0}.row:hover{background:#fafafa}.row.selected{background:#f5f8fc}.row-title{font-size:10px;font-weight:620}.row-sub,.row-label{font-size:9px;color:var(--muted);margin-top:2px}.row-value{font-size:10px;font-weight:600}.badge{display:inline-flex;border:1px solid var(--line2);border-radius:99px;padding:2px 6px;font-size:9px}.badge.ok{color:var(--ok);background:#f3faf5}.badge.warn{color:var(--warn);background:#fff9ed}.badge.err{color:var(--danger);background:#fff4f3}.chart{height:145px;padding:12px 13px}.chart svg{width:100%;height:100%}
.inspector{display:none;min-width:0;border-left:1px solid var(--line);background:#fff;overflow:auto}.with-inspector .inspector{display:block}.inspector-head{height:45px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:650}.inspector-body{padding:14px}.inspector-body h4{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px}.kv{display:grid;grid-template-columns:84px 1fr;gap:8px 10px;margin:0}.kv dt{color:var(--muted);font-size:10px}.kv dd{margin:0;font-size:10px}.mini{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:5px 8px;font-size:10px}.output{display:none;grid-column:1/-1;border-top:1px solid var(--line);background:#fbfbfc;min-height:0}.with-output .output{display:flex;flex-direction:column}.output-head{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--line)}.tabs{display:flex;gap:4px}.tab{border:0;background:transparent;border-radius:6px;padding:4px 7px;font-size:10px}.tab.active{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}.output-body{padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;line-height:1.7;overflow:auto}.empty{height:100%;display:grid;place-items:center;color:var(--muted)}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar"><div class="side-inner">
    <div class="side-top"><div class="traffic"><i></i><i></i><i></i></div><button class="collapse" id="collapse" title="收起导航"><svg viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="13" rx="3"/><line x1="7.5" y1="3.5" x2="7.5" y2="16.5"/><polyline points="12,7 9.5,10 12,13"/></svg></button></div>
    <div class="brand"><div class="brandmark">A</div><span>Arthur Studio</span></div>
    <nav class="nav">
      <button class="nav-leaf active" data-view="summary"><span class="nav-icon"><svg viewBox="0 0 20 20"><rect x="3.5" y="3.5" width="5.5" height="5.5" rx="1.5"/><rect x="11" y="3.5" width="5.5" height="5.5" rx="1.5"/><rect x="3.5" y="11" width="5.5" height="5.5" rx="1.5"/><rect x="11" y="11" width="5.5" height="5.5" rx="1.5"/></svg></span><span class="label">Summary Cards</span></button>
      <div class="nav-group open" id="tables"><button class="nav-group-head" data-group="tables"><span class="nav-icon"><svg viewBox="0 0 20 20"><rect x="3.5" y="4" width="13" height="12" rx="2"/><line x1="7" y1="8" x2="13.5" y2="8"/><line x1="7" y1="11" x2="13.5" y2="11"/><line x1="7" y1="14" x2="11.5" y2="14"/></svg></span><span class="label">Data Tables</span><span class="chev">›</span></button><div class="children"><button class="child" data-view="table">Primary Table</button><button class="child" data-view="history">History Table</button></div></div>
      <div class="nav-group" id="split"><button class="nav-group-head" data-group="split"><span class="nav-icon"><svg viewBox="0 0 20 20"><rect x="3.5" y="4" width="13" height="12" rx="2"/><line x1="8" y1="4" x2="8" y2="16"/></svg></span><span class="label">Split Views</span><span class="chev">›</span></button><div class="children"><button class="child" data-view="inspector">List + Inspector</button><button class="child" data-view="dense">Dense List</button></div></div>
      <button class="nav-leaf" data-view="metrics"><span class="nav-icon"><svg viewBox="0 0 20 20"><polyline points="3,13 7,10 10,11 14,7 17,8"/><line x1="3" y1="16.5" x2="17" y2="16.5"/></svg></span><span class="label">Metrics & Charts</span></button>
      <button class="nav-leaf" data-view="modules"><span class="nav-icon"><svg viewBox="0 0 20 20"><rect x="4" y="4" width="5" height="5" rx="1.4"/><rect x="11" y="4" width="5" height="5" rx="1.4"/><rect x="4" y="11" width="5" height="5" rx="1.4"/><rect x="11" y="11" width="5" height="5" rx="1.4"/></svg></span><span class="label">Module Cards</span></button>
      <button class="nav-leaf" data-view="controls"><span class="nav-icon"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.8"/><path d="M10 3.5v1.6M10 14.9v1.6M16.5 10h-1.6M5.1 10H3.5M14.8 5.2l-1.1 1.1M6.3 13.7l-1.1 1.1M14.8 14.8l-1.1-1.1M6.3 6.3L5.2 5.2"/></svg></span><span class="label">Controls</span></button>
    </nav>
    <div class="spacer"></div><div class="profile"><div class="avatar">SA</div><div><b>Workspace</b><small>Local</small></div></div>
  </div></aside>
  <main class="main">
    <div class="toolbar"><div class="title"><h1 id="title">Summary Cards</h1><p id="path">Prototype / Summary Cards</p></div><div class="tools"><button class="tool" id="outputBtn" title="Output"><svg viewBox="0 0 20 20"><rect x="3.5" y="4" width="13" height="12" rx="2"/><line x1="3.5" y1="11.5" x2="16.5" y2="11.5"/></svg></button></div></div>
    <div class="workspace" id="workspace"><section class="canvas" id="canvas"></section><aside class="inspector"><div class="inspector-head"><span>Inspector</span><button class="mini" id="closeInspector">Close</button></div><div class="inspector-body" id="inspectorBody"></div></aside><section class="output"><div class="output-head"><div class="tabs"><button class="tab active">Logs</button><button class="tab">Problems</button><button class="tab">Terminal</button></div><button class="mini" id="closeOutput">Close</button></div><div class="output-body">15:47:12 INFO  workspace initialized<br>15:47:14 INFO  143 modules loaded<br>15:47:15 WARN  legacy adapter uses old metadata schema</div></section></div>
  </main>
</div>
<script>
const app=document.getElementById('app'),canvas=document.getElementById('canvas'),workspace=document.getElementById('workspace'),title=document.getElementById('title'),path=document.getElementById('path');
const meta={summary:['Summary Cards','Prototype / Summary Cards'],table:['Primary Table','Prototype / Data Tables / Primary Table'],history:['History Table','Prototype / Data Tables / History Table'],inspector:['List + Inspector','Prototype / Split Views / List + Inspector'],dense:['Dense List','Prototype / Split Views / Dense List'],metrics:['Metrics & Charts','Prototype / Metrics & Charts'],modules:['Module Cards','Prototype / Module Cards'],controls:['Controls','Prototype / Controls']};
const rows=[['plugin-index-sync','Plugin index sync','edge-win-07','Running','42%','Node + Agent'],['device-self-test','Device self-test','edge-linux-08','Failed','71%','Go + Python'],['telemetry-rollup','Telemetry rollup','edge-linux-03','Healthy','33%','Go'],['analysis-worker','Analysis worker','edge-linux-12','Waiting','7%','Python / scipy']];
function badge(s){const c=s==='Healthy'?'ok':s==='Failed'?'err':s==='Waiting'?'warn':'';return `<span class="badge ${c}">${s}</span>`}
function cards(){return `<div class="grid"><div class="card metric"><span class="name">Running Tasks</span><b>4</b><small>1 waiting · 1 failed</small><div class="bar"><i style="width:72%"></i></div></div><div class="card metric"><span class="name">Devices Online</span><b>10 / 10</b><small>No disconnects</small><div class="bar"><i style="width:100%"></i></div></div><div class="card metric"><span class="name">Problems</span><b>2</b><small>Need attention</small><div class="bar"><i style="width:24%;background:#d19a47"></i></div></div><div class="card metric"><span class="name">P95 Latency</span><b>18 ms</b><small>Healthy</small><div class="bar"><i style="width:28%"></i></div></div></div>`}
function rowHtml(r){return `<div class="row" data-row="${r[0]}"><div><div class="row-title">${r[1]}</div><div class="row-sub">${r[2]}</div></div><div><div class="row-value">${r[4]}</div><div class="row-label">CPU</div></div><div>${badge(r[3])}</div></div>`}
function summary(){return `${cards()}<div class="sections"><div class="card section"><div class="section-head"><h3>System Health</h3><span>Updated just now</span></div>${rows.slice(0,3).map(rowHtml).join('')}</div><div class="card section"><div class="section-head"><h3>Resource Snapshot</h3><span>Current</span></div>${rows.slice(1,4).map(rowHtml).join('')}</div><div class="card section wide"><div class="section-head"><h3>Recent Activity</h3><span>Last 30 min</span></div>${rows.map(rowHtml).join('')}</div></div>`}
function table(){return `<div class="sections" style="padding-top:16px"><div class="card section wide"><div class="section-head"><h3>Tasks</h3><span>4 items</span></div>${rows.map(rowHtml).join('')}</div></div>`}
function metrics(){return `${cards()}<div class="sections"><div class="card section wide"><div class="section-head"><h3>Latency & Throughput</h3><span>Last 15 min</span></div><div class="chart"><svg viewBox="0 0 900 140" preserveAspectRatio="none"><line x1="0" y1="118" x2="900" y2="118" stroke="#ececef"/><line x1="0" y1="78" x2="900" y2="78" stroke="#f1f1f2"/><polyline fill="none" stroke="#7ea2dd" stroke-width="2.2" points="0,104 70,98 140,102 210,88 280,91 350,80 420,84 490,67 560,73 630,58 700,62 770,49 840,55 900,46"/><polyline fill="none" stroke="#a7a7ad" stroke-width="1.8" points="0,62 70,65 140,58 210,67 280,61 350,65 420,57 490,62 560,54 630,58 700,50 770,53 840,47 900,51"/></svg></div></div><div class="card section"><div class="section-head"><h3>Resource Usage</h3><span>Current</span></div>${rows.slice(0,3).map(rowHtml).join('')}</div><div class="card section"><div class="section-head"><h3>Runtime Health</h3><span>4 nodes</span></div>${rows.slice(1,4).map(rowHtml).join('')}</div></div>`}
function render(view){const m=meta[view]||meta.summary;title.textContent=m[0];path.textContent=m[1];workspace.classList.remove('with-inspector');if(view==='summary')canvas.innerHTML=summary();else if(view==='metrics')canvas.innerHTML=metrics();else if(['table','history','inspector','dense'].includes(view))canvas.innerHTML=table();else canvas.innerHTML=`<div class="empty">${m[0]} — 使用相同的 Workspace / Section / Card / Row 视觉语法。</div>`;bindRows()}
function bindRows(){canvas.querySelectorAll('[data-row]').forEach(el=>el.onclick=()=>{canvas.querySelectorAll('.row').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');const r=rows.find(x=>x[0]===el.dataset.row);document.getElementById('inspectorBody').innerHTML=`<div style="font-size:13px;font-weight:650">${r[1]}</div><div style="color:var(--muted);font-size:10px;margin-top:3px">${r[2]}</div><h4>Properties</h4><dl class="kv"><dt>Status</dt><dd>${badge(r[3])}</dd><dt>Runtime</dt><dd>${r[5]}</dd><dt>CPU</dt><dd>${r[4]}</dd><dt>Updated</dt><dd>just now</dd></dl><h4>Actions</h4><button class="mini" onclick="workspace.classList.add('with-output')">Open Logs</button>`;workspace.classList.add('with-inspector')}}
document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.group).classList.toggle('open'));
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav-group-head').forEach(x=>x.classList.remove('active-parent'));b.classList.add('active');const g=b.closest('.nav-group');if(g)g.querySelector('.nav-group-head').classList.add('active-parent');render(b.dataset.view)});
document.getElementById('collapse').onclick=()=>app.classList.toggle('rail');document.getElementById('closeInspector').onclick=()=>workspace.classList.remove('with-inspector');document.getElementById('outputBtn').onclick=e=>{workspace.classList.toggle('with-output');e.currentTarget.classList.toggle('active',workspace.classList.contains('with-output'))};document.getElementById('closeOutput').onclick=()=>workspace.classList.remove('with-output');render('summary');
</script>
</body>
</html>
